# Installed by provision-ubuntu-server.sh -- do not edit; edit the repo template.
#
# CUDA pinned (page-locked) host memory and NCCL both allocate against
# RLIMIT_MEMLOCK. Ubuntu's default is a few MB: fine for a desktop, far too
# small for multi-GPU inference.
#
# This matters specifically for ROOTLESS docker accounts. A rootless daemon runs
# AS the account, so it cannot raise that account's own hard limit --
# `default-ulimits` in its daemon.json is capped by whatever is set here. A
# rootful daemon runs as root and has no such constraint.
#
# Applies at the account's next login. Verify with:  ulimit -l
